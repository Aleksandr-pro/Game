:root {
  --bg: #f4f6f2;
  --surface: #ffffff;
  --surface-soft: #f8faf7;
  --text: #19251f;
  --muted: #728078;
  --muted-dark: #56655c;
  --line: #e4e9e3;
  --primary: #236a52;
  --primary-dark: #174c3b;
  --primary-soft: #e5f1eb;
  --lime: #dff47b;
  --lime-hover: #d3eb68;
  --danger: #c45454;
  --danger-soft: #fff0ee;
  --success-soft: #e9f6ee;
  --shadow-sm: 0 2px 8px rgba(28, 54, 41, 0.035);
  --shadow-md: 0 16px 45px rgba(27, 50, 38, 0.09);
  --radius: 20px;
  --sidebar: 236px;
  --font: "Manrope Variable", Inter, "SF Pro Display", "Segoe UI", Arial, sans-serif;
}

* { box-sizing: border-box; }
html { min-width: 320px; scroll-behavior: smooth; }
body {
  margin: 0;
  min-width: 320px;
  min-height: 100vh;
  background: var(--bg);
  color: var(--text);
  font-family: var(--font);
  font-size: 14px;
  line-height: 1.5;
  -webkit-font-smoothing: antialiased;
  text-rendering: optimizeLegibility;
}
body.modal-open { overflow: hidden; }
button, input, select, textarea { font: inherit; }
button, a { -webkit-tap-highlight-color: transparent; }
button { color: inherit; }
a { color: inherit; text-decoration: none; }
button { border: 0; cursor: pointer; }
button:disabled { cursor: not-allowed; opacity: 0.45; }
h1, h2, h3, p { margin: 0; }
h1, h2, h3 { line-height: 1.18; letter-spacing: -0.025em; }
h1 { font-size: 31px; font-weight: 750; }
h2 { font-size: 21px; font-weight: 720; }
h3 { font-size: 17px; font-weight: 700; }
svg { flex-shrink: 0; }
.icon { display: inline-block; vertical-align: middle; }
.hidden { display: none !important; }
.sr-only {
  position: absolute !important;
  width: 1px !important;
  height: 1px !important;
  padding: 0 !important;
  margin: -1px !important;
  overflow: hidden !important;
  clip: rect(0, 0, 0, 0) !important;
  white-space: nowrap !important;
  border: 0 !important;
}
:focus-visible { outline: 3px solid rgba(53, 132, 98, 0.28); outline-offset: 3px; }

/* Shell */
.app-shell { min-height: 100vh; }
.sidebar {
  position: fixed;
  inset: 0 auto 0 0;
  z-index: 30;
  display: flex;
  flex-direction: column;
  width: var(--sidebar);
  padding: 27px 19px 18px;
  background: #fbfcfa;
  border-right: 1px solid var(--line);
}
.brand { display: inline-flex; align-items: center; gap: 11px; width: fit-content; }
.brand-mark { display: inline-flex; color: var(--primary); }
.brand-copy { display: flex; flex-direction: column; }
.brand-copy strong { font-size: 28px; line-height: 1; letter-spacing: -0.055em; font-weight: 800; }
.brand-copy small { margin-top: 5px; color: var(--muted); font-size: 9.5px; letter-spacing: 0.02em; }
.side-nav { display: flex; flex-direction: column; gap: 6px; margin-top: 49px; }
.nav-caption { margin: 0 13px 9px; color: #99a39d; font-size: 10px; font-weight: 700; letter-spacing: 0.13em; }
.nav-item {
  position: relative;
  display: flex;
  align-items: center;
  gap: 13px;
  min-height: 48px;
  padding: 0 14px;
  border-radius: 13px;
  color: #637168;
  font-weight: 580;

.course-detail-art > span { position: absolute; top: 52px; right: 64px; display: flex; align-items: center; justify-content: center; width: 112px; height: 112px; border: 1px solid rgba(255,255,255,0.55); border-radius: 30px; background: rgba(255,255,255,0.32); transform: rotate(7deg); }

.course-detail-art i:nth-of-type(2) { right: 120px; bottom: -100px; width: 190px; height: 190px; }
.course-detail-grid { display: grid; grid-template-columns: minmax(0, 1fr) 290px; gap: 22px; margin-top: 27px; }
.lesson-list { overflow: hidden; border: 1px solid var(--line); border-radius: 17px; background: var(--surface); }
.lesson-row { display: flex; align-items: center; gap: 13px; width: 100%; padding: 15px 18px; border-bottom: 1px solid #edf0ec; background: white; text-align: left; }

.lesson-number { display: flex; align-items: center; justify-content: center; width: 36px; height: 36px; border-radius: 11px; background: #f1f4f0; color: #7a887e; font-size: 10px; font-weight: 700; }
.lesson-number.complete { background: var(--primary-soft); color: var(--primary); }
.lesson-row-copy { display: flex; flex: 1; flex-direction: column; }
.lesson-row-copy strong { font-size: 12px; }
.lesson-row-copy small { margin-top: 3px; color: var(--muted); font-size: 9px; }
.lesson-status { display: flex; align-items: center; gap: 6px; color: var(--primary); font-size: 9.5px; font-weight: 700; }
.outcomes-card { align-self: start; padding: 23px; }
.outcomes-card h3 { margin-top: 7px; }
.outcomes-card ul { display: flex; flex-direction: column; gap: 15px; margin: 22px 0; padding: 0; list-style: none; }
.outcomes-card li { display: flex; align-items: flex-start; gap: 9px; color: var(--muted-dark); font-size: 10.5px; }

/* Tests and diagnostic */
.diagnostic-hero-card { position: relative; display: flex; overflow: hidden; min-height: 280px; padding: 31px 36px; border-radius: 22px; background: #233f36; color: white; }
.diagnostic-hero-card::before { content: ""; position: absolute; top: -160px; right: -60px; width: 440px; height: 440px; border: 1px solid rgba(255,255,255,0.06); border-radius: 50%; box-shadow: 0 0 0 60px rgba(255,255,255,0.018), 0 0 0 120px rgba(255,255,255,0.012); }
.diagnostic-hero-copy { position: relative; z-index: 2; max-width: 620px; }
.diagnostic-label { display: inline-flex; align-items: center; gap: 6px; color: var(--lime); font-size: 8.5px; font-weight: 750; letter-spacing: 0.11em; }
.diagnostic-label.dark { color: var(--primary); }
.diagnostic-hero-copy h2 { margin-top: 13px; font-size: 30px; }
.diagnostic-hero-copy > p { max-width: 535px; margin-top: 10px; color: #c0d0c7; font-size: 11.5px; line-height: 1.65; }
.diagnostic-facts { display: flex; flex-wrap: wrap; gap: 17px; margin-top: 19px; color: #d5e0d9; font-size: 9.5px; }
.diagnostic-facts span { display: flex; align-items: center; gap: 5px; }
.diagnostic-hero-copy .button { margin-top: 23px; }
.diagnostic-score-visual { position: relative; z-index: 2; display: flex; align-items: center; justify-content: center; min-width: 240px; margin-left: auto; }
.diagnostic-score-visual .ring-track { stroke: rgba(255,255,255,0.1); }
.diagnostic-score-visual .ring-value { stroke: var(--lime); }
.diagnostic-score-visual .ring-text small { color: #b9cac1; }
.diagnostic-brain { display: flex; align-items: center; justify-content: center; width: 124px; height: 124px; border: 1px solid rgba(255,255,255,0.16); border-radius: 38px; background: rgba(255,255,255,0.07); color: var(--lime); transform: rotate(-5deg); }
.diagnostic-score-visual > span { position: absolute; right: -5px; bottom: 12px; color: #c3d4ca; font-size: 9px; text-align: center; transform: rotate(4deg); }
.topic-tests-section { margin-top: 28px; }
.test-grid { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 15px; }
.test-card { padding: 19px; border: 1px solid var(--line); border-radius: 17px; background: var(--surface); box-shadow: var(--shadow-sm); }
.test-card-top { display: flex; align-items: flex-start; justify-content: space-between; gap: 10px; }
.score-badge { display: inline-flex; align-items: center; gap: 4px; padding: 5px 8px; border-radius: 20px; background: #f6f0dc; color: #9a7b2e; font-size: 8px; font-weight: 700; }
.score-badge.high { background: var(--success-soft); color: var(--primary); }
.test-card h3 { margin-top: 14px; font-size: 15px; }
.test-card > p { min-height: 31px; margin-top: 6px; color: var(--muted); font-size: 9.5px; line-height: 1.55; }
.test-card-footer { display: flex; align-items: center; justify-content: space-between; margin-top: 16px; padding-top: 13px; border-top: 1px solid #edf0ec; }
.test-card-footer > span { display: flex; align-items: center; gap: 5px; color: var(--muted); font-size: 9px; }
.round-arrow { display: flex; align-items: center; justify-content: center; width: 32px; height: 32px; border-radius: 50%; background: var(--primary-soft); color: var(--primary); transition: transform 150ms ease, background 150ms ease; }
.round-arrow:hover { transform: translateX(2px); background: #d6e9dc; }
.diagnostic-intro { display: grid; grid-template-columns: minmax(0, 1.25fr) minmax(300px, 0.75fr); overflow: hidden; min-height: 545px; border: 1px solid var(--line); border-radius: 24px; background: var(--surface); }
.diagnostic-intro-copy { padding: 42px 45px; }
.diagnostic-intro-copy h1 { margin-top: 16px; font-size: 34px; line-height: 1.18; }
.diagnostic-intro-copy > p { max-width: 590px; margin-top: 16px; color: var(--muted); font-size: 12px; line-height: 1.7; }
.diagnostic-steps { display: flex; flex-direction: column; gap: 15px; margin-top: 27px; }
.diagnostic-steps > div { display: flex; align-items: center; gap: 12px; }
.diagnostic-steps > div > span { display: flex; align-items: center; justify-content: center; width: 30px; height: 30px; border-radius: 10px; background: var(--primary-soft); color: var(--primary); font-size: 10px; font-weight: 750; }
.diagnostic-steps p { display: flex; flex-direction: column; }
.diagnostic-steps strong { font-size: 11px; }
.diagnostic-steps small { margin-top: 2px; color: var(--muted); font-size: 9px; }
.diagnostic-intro-copy .button { margin-top: 28px; }
.diagnostic-time { display: inline-flex; align-items: center; gap: 5px; margin-left: 12px; color: var(--muted); font-size: 9px; }
.diagnostic-intro-art { position: relative; overflow: hidden; background: #eaf1e9; }
.art-ring { position: absolute; border: 1px solid rgba(44,105,79,0.12); border-radius: 50%; }
.ring-a { top: 50%; left: 50%; width: 340px; height: 340px; transform: translate(-50%, -50%); }
.ring-b { top: 50%; left: 50%; width: 245px; height: 245px; border-style: dashed; transform: translate(-50%, -50%); }
.art-center { position: absolute; top: 50%; left: 50%; display: flex; flex-direction: column; align-items: center; justify-content: center; width: 174px; height: 174px; border-radius: 50%; background: var(--primary); color: white; box-shadow: 0 20px 45px rgba(34,95,72,0.2); transform: translate(-50%, -50%); }
.art-center > span { margin-top: 9px; color: #d7e6dc; font-size: 10px; line-height: 1.3; text-align: center; }
.art-skill { position: absolute; display: flex; align-items: center; gap: 6px; padding: 10px 13px; border: 1px solid rgba(255,255,255,0.8); border-radius: 12px; background: rgba(255,255,255,0.84); color: var(--primary-dark); font-size: 9.5px; font-weight: 650; box-shadow: 0 8px 20px rgba(43,77,57,0.07); }
.art-skill-a { top: 18%; left: 9%; transform: rotate(-5deg); }
.art-skill-b { top: 28%; right: 6%; transform: rotate(5deg); }
.art-skill-c { right: 13%; bottom: 16%; transform: rotate(-3deg); }
.art-spark { position: absolute; bottom: 19%; left: 16%; color: #9d863e; font-size: 28px; }
.previous-diagnostic { display: flex; align-items: center; gap: 13px; margin-top: 18px; padding: 17px 20px; border: 1px solid var(--line); border-radius: 16px; background: var(--surface); }
.previous-diagnostic > span { color: var(--primary); }
.previous-diagnostic > div { flex: 1; }
.previous-diagnostic strong { font-size: 11px; }
.previous-diagnostic p { margin-top: 3px; color: var(--muted); font-size: 9px; }
.result-celebration { margin-bottom: 26px; text-align: center; }
.result-check { display: inline-flex; align-items: center; justify-content: center; width: 57px; height: 57px; margin-bottom: 14px; border-radius: 50%; background: var(--primary); color: white; box-shadow: 0 0 0 9px #e5eee7; }
.result-celebration h1 { margin-top: 8px; }
.result-celebration p { max-width: 580px; margin: 9px auto 0; color: var(--muted); font-size: 11.5px; }
.diagnostic-result-grid { display: grid; grid-template-columns: minmax(0, 1.1fr) minmax(320px, 0.9fr); gap: 20px; align-items: start; }
.knowledge-map-card, .generated-plan-card { padding: 27px; }
.knowledge-score { display: flex; align-items: center; gap: 23px; padding-bottom: 23px; border-bottom: 1px solid var(--line); }
.knowledge-score h2 { margin-top: 6px; font-size: 18px; }
.knowledge-score p { margin-top: 7px; color: var(--muted); font-size: 10px; line-height: 1.55; }
.diagnostic-skills { display: flex; flex-direction: column; gap: 14px; margin-top: 23px; }
.diagnostic-skill-row { display: grid; grid-template-columns: 95px minmax(0, 1fr) 34px; align-items: center; gap: 11px; font-size: 9.5px; }
.diagnostic-skill-row > span { color: var(--muted-dark); }
.diagnostic-skill-row > strong { font-size: 9px; text-align: right; }
.diagnostic-skill-row .progress-bar { height: 7px; }
.plan-sparkle { position: absolute; top: 25px; right: 25px; color: #9b843b; }
.generated-plan-card { position: relative; }
.generated-plan-card h2 { margin-top: 7px; font-size: 20px; }
.generated-plan-card > p { margin-top: 7px; color: var(--muted); font-size: 10px; }
.generated-plan-list { display: flex; flex-direction: column; gap: 10px; margin-top: 20px; }
.generated-plan-item { display: flex; align-items: center; gap: 9px; padding: 11px; border: 1px solid #e8ede7; border-radius: 12px; background: #fafcf9; }
.plan-order { color: #a2aca5; font-size: 9px; font-weight: 700; }
.generated-plan-item > div { display: flex; flex-direction: column; }
.generated-plan-item strong { font-size: 10.5px; }
.generated-plan-item small { margin-top: 2px; color: var(--muted); font-size: 8.5px; }
.plan-daily-note { display: flex; align-items: center; gap: 7px; margin: 17px 0; padding: 11px; border-radius: 10px; background: var(--primary-soft); color: var(--primary); font-size: 9px; font-weight: 650; }

/* Progress */
.level-pill { display: flex; align-items: center; gap: 7px; padding: 11px 14px; border: 1px solid #ece4cf; border-radius: 13px; background: #fffaf0; color: #94712c; font-size: 10px; font-weight: 700; }
.level-pill > span { margin-left: 6px; padding-left: 12px; border-left: 1px solid #e7dcc3; color: #a39171; font-size: 9px; }
.stats-grid { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 13px; }
.stat-card { display: grid; grid-template-columns: auto 1fr; align-items: center; gap: 12px; padding: 17px; border: 1px solid var(--line); border-radius: 16px; background: var(--surface); }
.stat-card-icon { display: flex; align-items: center; justify-content: center; width: 42px; height: 42px; border-radius: 13px; }
.stat-card > div { display: flex; flex-direction: column; }
.stat-card > div strong { font-size: 20px; line-height: 1.1; letter-spacing: -0.04em; }
.stat-card > div span { margin-top: 3px; color: var(--muted); font-size: 8.5px; }
.stat-card > small { grid-column: 2; margin-top: -8px; color: #97a198; font-size: 8px; }
.progress-main-grid { display: grid; grid-template-columns: minmax(0, 1.4fr) minmax(290px, 0.6fr); gap: 17px; margin-top: 18px; }
.activity-chart-card, .skill-progress-card, .calendar-card, .achievements-card { padding: 22px; }
.bar-chart { display: grid; grid-template-columns: repeat(7, 1fr); gap: 12px; height: 225px; margin-top: 24px; }
.bar-column { display: grid; grid-template-rows: 16px 1fr 18px; gap: 6px; text-align: center; }
.bar-value { color: var(--muted); font-size: 8px; }
.bar-track { position: relative; overflow: hidden; height: 100%; border-radius: 8px; background: #f2f5f0; }
.bar-fill { position: absolute; right: 0; bottom: 0; left: 0; border-radius: 8px; background: #b8d3c1; transition: height 400ms ease; }
.bar-column.today .bar-fill { background: var(--primary); }
.bar-column.today small { color: var(--primary); font-weight: 750; }
.bar-column small { color: var(--muted); font-size: 8.5px; }
.skill-progress-list { display: flex; flex-direction: column; gap: 15px; margin-top: 20px; }
.skill-progress-row { display: flex; align-items: center; gap: 10px; }
.skill-progress-row > div { flex: 1; min-width: 0; }
.skill-progress-row > div > span { display: flex; justify-content: space-between; margin-bottom: 6px; }
.skill-progress-row strong { font-size: 9.5px; }
.skill-progress-row small { color: var(--muted); font-size: 8.5px; }
.skill-progress-row .progress-bar { height: 5px; }
.progress-bottom-grid { display: grid; grid-template-columns: minmax(0, 1fr) minmax(340px, 1fr); gap: 17px; margin-top: 18px; }
.activity-calendar { display: grid; grid-template-columns: repeat(7, 1fr); gap: 8px; margin-top: 21px; }
.activity-cell { aspect-ratio: 1.35; border-radius: 6px; }
.level-0 { background: #eef2ed; }
.level-1 { background: #bedac7; }
.level-2 { background: #559478; }
.calendar-legend { display: flex; align-items: center; justify-content: flex-end; gap: 5px; margin-top: 13px; color: var(--muted); font-size: 8px; }
.calendar-legend i { width: 12px; height: 12px; border-radius: 3px; }
.achievement-list { display: flex; flex-direction: column; gap: 10px; margin-top: 17px; }
.achievement { display: flex; align-items: center; gap: 11px; padding: 10px; border-radius: 12px; background: #fafbf9; }
.achievement-icon { display: flex; align-items: center; justify-content: center; width: 38px; height: 38px; border-radius: 12px; background: #eef1ed; color: #89938c; }
.achievement-icon.gold { background: #f8edce; color: #b08830; }
.achievement-icon.violet { background: #eee9f7; color: #806aa5; }
.achievement > div { display: flex; flex: 1; flex-direction: column; }
.achievement strong { font-size: 10px; }
.achievement small { margin-top: 2px; color: var(--muted); font-size: 8.5px; }
.achievement > .icon { color: var(--primary); }
.achievement.locked { opacity: 0.55; }
.achievement.locked > .icon { color: var(--muted); }

/* Profile */
.profile-grid { display: grid; grid-template-columns: minmax(0, 1fr) 315px; gap: 20px; align-items: start; }
.profile-form-card { padding: 26px; }
.profile-summary { display: flex; align-items: center; gap: 13px; padding-bottom: 22px; border-bottom: 1px solid var(--line); }
.profile-avatar-large { display: flex; align-items: center; justify-content: center; width: 56px; height: 56px; border-radius: 17px; background: #dcebe1; color: var(--primary); font-size: 21px; font-weight: 750; }
.profile-summary h2 { font-size: 18px; }
.profile-summary p { margin-top: 3px; color: var(--muted); font-size: 9.5px; }
.profile-xp { display: inline-flex; align-items: center; gap: 5px; margin-left: auto; padding: 6px 9px; border-radius: 20px; background: #faf1d9; color: #99792e; font-size: 9px; font-weight: 700; }
.profile-form { display: flex; flex-direction: column; gap: 19px; margin-top: 23px; }
.form-row { display: grid; grid-template-columns: 1fr 1fr; gap: 15px; }
.profile-form label:not(.toggle-setting) { display: flex; flex-direction: column; gap: 7px; }
.profile-form label > span { font-size: 10px; font-weight: 650; }
.profile-form input[type="text"], .profile-form select { width: 100%; height: 43px; padding: 0 13px; border: 1px solid #dfe6df; border-radius: 11px; outline: none; background: #fbfcfa; color: var(--text); font-size: 11px; }
.profile-form input[type="text"]:focus, .profile-form select:focus { border-color: #83aa92; box-shadow: 0 0 0 3px #edf4ef; }
.field-help { color: var(--muted); font-size: 8.5px; }
.toggle-setting { display: flex; align-items: center; justify-content: space-between; gap: 15px; padding: 15px; border-radius: 12px; background: #f7f9f6; cursor: pointer; }
.toggle-setting > span { display: flex; flex-direction: column; }
.toggle-setting strong { font-size: 10.5px; }
.toggle-setting small { margin-top: 3px; color: var(--muted); font-size: 8.5px; font-weight: 400; }
.toggle-setting input { position: absolute; opacity: 0; pointer-events: none; }
.toggle-setting i { position: relative; width: 39px; height: 22px; border-radius: 20px; background: #cbd3cc; transition: background 150ms ease; }
.toggle-setting i::after { content: ""; position: absolute; top: 3px; left: 3px; width: 16px; height: 16px; border-radius: 50%; background: white; box-shadow: 0 1px 4px rgba(0,0,0,0.15); transition: transform 150ms ease; }
.toggle-setting input:checked + i { background: var(--primary); }
.toggle-setting input:checked + i::after { transform: translateX(17px); }
.profile-form > .button { align-self: flex-start; }
.profile-side { display: flex; flex-direction: column; gap: 16px; }
.app-install-panel { padding: 24px; text-align: center; }
.app-panel-logo { display: inline-flex; color: var(--primary); }
.app-install-panel h3 { margin-top: 13px; }
.app-install-panel p { margin: 8px 0 18px; color: var(--muted); font-size: 10px; line-height: 1.6; }
.data-panel { display: grid; grid-template-columns: auto 1fr; gap: 11px; padding: 20px; }
.data-panel h3 { font-size: 12px; }
.data-panel p { margin-top: 5px; color: var(--muted); font-size: 9px; line-height: 1.55; }
.muted-link { grid-column: 2; justify-self: start; color: var(--muted); font-size: 9px; }

/* Focus mode and learning session */
.focus-mode .sidebar, .focus-mode .topbar, .focus-mode .mobile-nav { display: none; }
.focus-mode .app-body { margin-left: 0; }
.focus-mode .main-content { max-width: none; padding: 0; }
.focus-shell { min-height: 100vh; background: #f5f7f3; }
.session-header { display: grid; grid-template-columns: 1fr auto 1fr; align-items: center; height: 77px; padding: 0 36px; border-bottom: 1px solid var(--line); background: rgba(255,255,255,0.9); }
.session-brand .brand-copy strong { font-size: 25px; }
.session-brand .brand-copy small { max-width: 200px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.session-header-progress { display: flex; flex-direction: column; align-items: center; }
.session-header-progress > span { font-size: 11px; font-weight: 700; }
.session-header-progress small { margin-top: 2px; color: var(--muted); font-size: 8.5px; }
.session-exit-button { justify-self: end; min-height: 36px; padding: 0 12px; border: 0; font-size: 10px; }
.session-top-progress { height: 4px; background: #e7ece6; }
.session-top-progress > span { display: block; height: 100%; border-radius: 0 4px 4px 0; background: var(--primary); transition: width 300ms ease; }
.session-content { width: 100%; max-width: 1080px; margin: 0 auto; padding: 39px 28px 50px; }
.question-layout { display: grid; grid-template-columns: minmax(0, 1fr) 258px; gap: 21px; align-items: start; }
.question-card { padding: 30px 32px 25px; border: 1px solid var(--line); border-radius: 21px; background: var(--surface); box-shadow: 0 8px 30px rgba(31,57,43,0.045); }
.question-skill { display: flex; align-items: center; justify-content: space-between; gap: 15px; }
.question-skill > span:first-child { display: flex; align-items: center; gap: 9px; color: var(--muted-dark); font-size: 9.5px; font-weight: 650; }
.question-skill > span:last-child { color: #98a29b; font-size: 9px; }
.question-card > h1 { max-width: 650px; margin-top: 26px; font-size: 27px; line-height: 1.35; letter-spacing: -0.025em; }
.question-instruction { margin-top: 8px; color: var(--muted); font-size: 10px; }
.answer-options { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 11px; margin-top: 25px; }
.answer-option { display: flex; align-items: center; gap: 11px; min-height: 57px; padding: 9px 13px; border: 1.5px solid #e1e7e0; border-radius: 13px; background: #fbfcfa; text-align: left; transition: border-color 140ms ease, background 140ms ease, transform 140ms ease; }
.answer-option:not(:disabled):hover { border-color: #9ebaaa; background: #f6faf6; transform: translateY(-1px); }
.answer-option:disabled { opacity: 1; cursor: default; }
.option-letter { display: flex; align-items: center; justify-content: center; flex-shrink: 0; width: 29px; height: 29px; border-radius: 9px; background: #eff3ee; color: #7b887f; font-size: 10px; font-weight: 700; }
.option-value { flex: 1; font-size: 13px; font-weight: 650; }
.option-state { display: flex; width: 20px; }
.answer-option.selected { border-color: var(--primary); background: #f0f7f2; }
.answer-option.selected .option-letter { background: var(--primary); color: white; }
.answer-option.correct { border-color: #5f9e7b; background: #edf8f0; }
.answer-option.correct .option-letter { background: #5c9977; color: white; }
.answer-option.correct .option-state { color: #428361; }
.answer-option.wrong { border-color: #d9857d; background: #fff3f1; }
.answer-option.wrong .option-letter { background: #cb7169; color: white; }
.answer-option.wrong .option-state { color: #bd5c55; }
.numeric-answer { margin-top: 25px; }

// ---- src/learning.js ----
function normalizeAnswer(value) {
  return String(value ?? '')
    .trim()
    .toLowerCase()
    .replace(/[−–—]/g, '-')
    .replace(/,/g, '.')
    .replace(/\s+/g, ' ');
}

function numericValue(value) {
  const normalized = normalizeAnswer(value).replace(/\s/g, '');
  if (/^-?\d+(?:\.\d+)?$/.test(normalized)) return Number(normalized);
  const fraction = normalized.match(/^(-?\d+(?:\.\d+)?)\/(-?\d+(?:\.\d+)?)$/);
  if (fraction && Number(fraction[2]) !== 0) return Number(fraction[1]) / Number(fraction[2]);
  return null;
}

function isAnswerCorrect(question, value) {
  if (value === undefined || value === null || normalizeAnswer(value) === '') return false;
  const expected = normalizeAnswer(question.answer);
  const actual = normalizeAnswer(value);
  if (expected === actual) return true;
  if (question.type === 'input') {
    const expectedNumber = numericValue(expected);
    const actualNumber = numericValue(actual);
    return expectedNumber !== null && actualNumber !== null && Math.abs(expectedNumber - actualNumber) < 1e-9;
  }
  return false;
}

function getSkillScores(questions, answers) {
  const buckets = {};
  questions.forEach((question) => {
    if (!buckets[question.skill]) buckets[question.skill] = { correct: 0, total: 0 };
    buckets[question.skill].total += 1;
    if (isAnswerCorrect(question, answers[question.id])) buckets[question.skill].correct += 1;
  });
  return Object.fromEntries(Object.entries(buckets).map(([skill, result]) => [
    skill,
    Math.round((result.correct / result.total) * 100)
  ]));
}

function scoreDiagnostic(questions, answers) {
  const correct = questions.reduce((sum, question) => sum + (isAnswerCorrect(question, answers[question.id]) ? 1 : 0), 0);
  return {
    correct,
    total: questions.length,
    score: questions.length ? Math.round((correct / questions.length) * 100) : 0,
    skills: getSkillScores(questions, answers)
  };
}

function createPersonalPlan(skillScores) {
  const order = Object.keys(SKILLS);
  return order
    .slice()
    .sort((a, b) => (skillScores[a] ?? 0) - (skillScores[b] ?? 0) || order.indexOf(a) - order.indexOf(b))
    .slice(0, 3);
}

function getRecommendedMessage(score) {
  if (score >= 85) return 'Отличная база! Добавим более сложные задачи и закрепим сильные стороны.';
  if (score >= 60) return 'Хорошая база. Сфокусируемся на темах, где пока есть пробелы.';
  return 'Начнём с небольших шагов и будем постепенно усложнять задания.';
}

function makeLessonQuestions(skills, perSkill = 2, variant = 0) {
  const result = [];
  skills.forEach((skill, skillIndex) => {
    const pool = QUESTION_BANK.filter((question) => question.skill === skill);
    if (!pool.length) return;
    const offset = (variant + skillIndex) % pool.length;
    const rotated = pool.slice(offset).concat(pool.slice(0, offset));
    result.push(...rotated.slice(0, Math.min(perSkill, rotated.length)));
  });
  return result;
}

function getSessionSummary(questions, answers) {
  const correct = questions.filter((question) => isAnswerCorrect(question, answers[question.id])).length;
  const answered = questions.filter((question) => normalizeAnswer(answers[question.id]) !== '').length;
  return {
    correct,
    answered,
    total: questions.length,
    accuracy: questions.length ? Math.round((correct / questions.length) * 100) : 0,
    xp: correct * 15 + (correct === questions.length && questions.length ? 20 : 0)
  };
}

function getLevel(xp) {
  const safeXp = Math.max(0, Number(xp) || 0);
  const level = Math.floor(safeXp / 500) + 1;
  return {
    level,
    current: safeXp % 500,
    needed: 500,
    progress: Math.round(((safeXp % 500) / 500) * 100)
  };
}

function cloneDefaultState() {
  return JSON.parse(JSON.stringify(DEFAULT_STATE));

function loadState() {
  const fallback = cloneDefaultState();
  try {
    const saved = JSON.parse(localStorage.getItem(STORAGE_KEY));
    if (!saved || saved.version !== fallback.version) return fallback;
    return {
      ...fallback,
      ...saved,
      user: { ...fallback.user, ...(saved.user || {}) },
      diagnostic: { ...fallback.diagnostic, ...(saved.diagnostic || {}) },
      skillLevels: { ...fallback.skillLevels, ...(saved.skillLevels || {}) },
      courseProgress: { ...fallback.courseProgress, ...(saved.courseProgress || {}) },
      testScores: { ...fallback.testScores, ...(saved.testScores || {}) }
    };
  } catch (error) {
    return fallback;
  }
}

function saveState() {
  try {
    localStorage.setItem(STORAGE_KEY, JSON.stringify(appState));
  } catch (error) {
    // Приложение остаётся рабочим, даже если хранилище недоступно.
  }
}

function esc(value) {

    '&': '&amp;', '<': '&lt;', '>': '&gt;', "'": '&#39;', '"': '&quot;'
  })[char]);
}

function plural(number, one, few, many) {
  const n = Math.abs(number) % 100;
  const n1 = n % 10;
  if (n > 10 && n < 20) return many;
  if (n1 > 1 && n1 < 5) return few;
  if (n1 === 1) return one;
  return many;
}

function capitalize(value) {
  return value ? value.charAt(0).toUpperCase() + value.slice(1) : value;

function progressRing(percent, size = 116, stroke = 9, className = '') {
  const safe = Math.max(0, Math.min(100, Number(percent) || 0));
  const radius = (size - stroke) / 2;
  const circumference = 2 * Math.PI * radius;
  const offset = circumference - (safe / 100) * circumference;
  return `<svg class="progress-ring ${className}" width="${size}" height="${size}" viewBox="0 0 ${size} ${size}" role="img" aria-label="${safe}%">
    <circle class="ring-track" cx="${size / 2}" cy="${size / 2}" r="${radius}" fill="none" stroke-width="${stroke}" />
    <circle class="ring-value" cx="${size / 2}" cy="${size / 2}" r="${radius}" fill="none" stroke-width="${stroke}" stroke-linecap="round" stroke-dasharray="${circumference}" stroke-dashoffset="${offset}" transform="rotate(-90 ${size / 2} ${size / 2})" />
  </svg>`;
}

  return `<div class="focus-shell ${session.finished ? 'finished' : ''}">
    <header class="session-header"><a class="brand session-brand" href="#home" data-action="session-exit"><span class="brand-mark">${brandMark(36)}</span><span class="brand-copy"><strong>sana</strong><small>${esc(session.title)}</small></span></a>
      <div class="session-header-progress"><span>${session.finished ? 'Завершено' : `${session.index + 1} из ${session.questions.length}`}</span><small>${session.kind === 'diagnostic' ? 'Диагностика' : 'Отвечай в своём темпе'}</small></div>
      <button class="button quiet session-exit-button" type="button" data-action="session-exit">${icon('x', 19)}<span>Выйти</span></button>
    </header>
    <div class="session-top-progress"><span style="width:${progress}%"></span></div>
    <div class="session-content">${session.finished ? renderSessionSummary() : renderQuestion()}</div>
    <span class="sr-only">${answeredCount} ответов сохранено</span>
  </div>`;
}

function renderQuestion() {
  const question = session.questions[session.index];
  const skill = SKILLS[question.skill];
  const isDiagnostic = session.kind === 'diagnostic';
  const selected = session.selected;
  const isLast = session.index === session.questions.length - 1;
  const correct = session.checked ? isAnswerCorrect(question, selected) : false;
  const answerArea = question.type === 'input'
    ? `<form id="answer-input-form" class="numeric-answer"><label for="answer-input">Твой ответ</label><div class="input-answer-wrap"><input id="answer-input" name="answer" type="text" inputmode="text" autocomplete="off" placeholder="Впиши число или дробь" value="${esc(selected)}" ${session.checked ? 'disabled' : ''}/><span>${icon('edit', 20)}</span></div><button class="sr-only" type="submit">Проверить</button></form>`
    : `<div class="answer-options">${question.options.map((option, index) => {
      const isSelected = normalizeAnswer(selected) === normalizeAnswer(option);
      const isExpected = isAnswerCorrect(question, option);
      const classes = ['answer-option'];
      if (isSelected) classes.push('selected');
      if (session.checked && isExpected) classes.push('correct');
      if (session.checked && isSelected && !isExpected) classes.push('wrong');
      return `<button type="button" class="${classes.join(' ')}" data-action="select-option" data-value="${esc(option)}" ${session.checked ? 'disabled' : ''} aria-pressed="${isSelected}"><span class="option-letter">${String.fromCharCode(65 + index)}</span><span class="option-value">${esc(option)}</span><span class="option-state">${session.checked && isExpected ? icon('check', 19) : session.checked && isSelected ? icon('x', 19) : ''}</span></button>`;
    }).join('')}</div>`;

  return `<div class="question-layout">
    <section class="question-card">
      <div class="question-skill"><span>${skillTile(question.skill, 'small')}${skill.title}</span><span>Вопрос ${session.index + 1}</span></div>
      <h1>${esc(question.prompt)}</h1>
      <p class="question-instruction">${question.type === 'input' ? 'Запиши ответ без пояснений' : 'Выбери один правильный ответ'}</p>
      ${answerArea}
      ${session.checked ? `<div class="answer-feedback ${correct ? 'correct' : 'wrong'}"><span class="feedback-icon">${icon(correct ? 'check' : 'refresh', 22)}</span><div><strong>${correct ? 'Верно! Отличная работа' : `Правильный ответ: ${esc(question.answer)}`}</strong><p>${esc(question.explanation)}</p></div></div>` : ''}
      <div class="question-actions"><span class="keyboard-hint">${!session.checked && question.type !== 'input' ? 'Можно выбрать ответ клавишами 1–4' : ''}</span>${session.checked ? `<button class="button primary" type="button" data-action="next-question">${isLast ? 'Посмотреть результат' : 'Следующий вопрос'} ${icon('right', 18)}</button>` : `<button class="button primary" id="answer-check" type="button" data-action="check-answer" ${normalizeAnswer(selected) ? '' : 'disabled'}>${isDiagnostic ? (isLast ? 'Завершить диагностику' : 'Далее') : 'Проверить ответ'} ${icon('right', 18)}</button>`}</div>
    </section>
    <aside class="question-aside">
      ${isDiagnostic ? `<div class="session-tip-card"><span>${icon('brain', 24)}</span><h3>Это не экзамен</h3><p>Не переживай, если не знаешь ответ. Диагностика нужна, чтобы не дать тебе слишком лёгкие или сложные задания.</p></div>` : `<div class="session-tip-card hint-card ${session.hintVisible ? 'opened' : ''}"><span>${icon('bulb', 24)}</span><h3>Нужна подсказка?</h3>${session.hintVisible ? `<p>${esc(question.hint)}</p>` : '<p>Подумай ещё немного или открой небольшую подсказку.</p><button class="text-link" type="button" data-action="show-hint">Показать подсказку</button>'}</div>`}
      <div class="session-pace-note">${icon('shield', 18)}<span>Нет таймера и оценок.<br>Главное — понять решение.</span></div>
    </aside>
  </div>`;
}

function renderSessionSummary() {
  const summary = session.summary;
  const wrongSkills = [...new Set(session.questions.filter((question) => !isAnswerCorrect(question, session.answers[question.id])).map((question) => question.skill))];
  return `<section class="session-summary">
    <div class="summary-decoration" aria-hidden="true"><span>✦</span><span>✦</span><span>✦</span></div>
    <span class="summary-award">${icon(summary.accuracy >= 70 ? 'trophy' : 'flag', 42)}</span>
    <span class="eyebrow">ЗАНЯТИЕ ЗАВЕРШЕНО</span><h1>${summary.accuracy >= 90 ? 'Блестящий результат!' : summary.accuracy >= 60 ? 'Хорошая работа!' : 'Ты сделал важный шаг!'}</h1><p>${summary.accuracy >= 60 ? 'Ещё немного практики — и эти темы будут даваться всё легче.' : 'Ошибки помогают понять, на что обратить внимание. Загляни в объяснения и попробуй ещё раз.'}</p>
    <div class="summary-score-row"><div class="ring-wrap summary-ring">${progressRing(summary.accuracy, 154, 12)}<div class="ring-text"><strong>${summary.accuracy}%</strong><small>точность</small></div></div><div class="summary-metrics"><div><span class="summary-metric-icon mint">${icon('circlecheck', 21)}</span><p><strong>${summary.correct} из ${summary.total}</strong><small>верных ответов</small></p></div><div><span class="summary-metric-icon yellow">${icon('star', 21)}</span><p><strong>+${summary.xp} XP</strong><small>получено опыта</small></p></div><div><span class="summary-metric-icon lavender">${icon('flame', 21)}</span><p><strong>${appState.streak} дней</strong><small>серия продолжается</small></p></div></div></div>
    ${wrongSkills.length ? `<div class="summary-recommendation">${icon('brain', 22)}<div><strong>Что повторить в следующий раз</strong><p>${wrongSkills.map((skill) => SKILLS[skill].title).join(' · ')}</p></div></div>` : `<div class="summary-recommendation perfect">${icon('sparkle', 22)}<div><strong>Все ответы верные!</strong><p>В следующем занятии добавим задачи посложнее.</p></div></div>`}
    <div class="summary-actions"><button class="button secondary" type="button" data-action="restart-session">${icon('refresh', 18)} Пройти ещё раз</button><button class="button primary" type="button" data-action="finish-session">${session.kind === 'test' ? 'К тестам' : session.kind === 'course' ? 'Вернуться к курсу' : 'На главную'} ${icon('right', 18)}</button></div>
  </section>`;
}

function startSession(kind, title, questions, extra = {}) {
  session = {
    kind, title, questions,
    index: 0, answers: {}, selected: '', checked: false, hintVisible: false,
    startedAt: Date.now(), finished: false, summary: null, ...extra
  };
  go('session');
}

function startDiagnostic() {
  diagnosticPreview = null;
  startSession('diagnostic', 'Диагностика знаний', DIAGNOSTIC_QUESTIONS);
}

function handleCheckAnswer() {
  if (!session || session.finished || session.checked) return;
  const question = session.questions[session.index];
  if (!normalizeAnswer(session.selected)) {
    showToast('Сначала выбери или введи ответ', 'info');
    return;
  }
  session.answers[question.id] = session.selected;
  if (session.kind === 'diagnostic') {
    if (session.index === session.questions.length - 1) {
      finishDiagnostic();
    } else {
      advanceSession();
    }
    return;
  }
  session.checked = true;
  render();
}

function advanceSession() {
  if (!session) return;
  if (session.index >= session.questions.length - 1) {
    finishSession();
    return;
  }
  session.index += 1;
  session.selected = '';
  session.checked = false;
  session.hintVisible = false;
  render();
}

function finishDiagnostic() {
  if (!session) return;
  diagnosticPreview = scoreDiagnostic(session.questions, session.answers);
  session = null;
  go('diagnostic');
}

function finishSession() {
  if (!session || session.finished) return;
  const summary = getSessionSummary(session.questions, session.answers);
  session.summary = summary;
  session.finished = true;
  const scores = getSkillScores(session.questions, session.answers);
  Object.entries(scores).forEach(([skill, score]) => {
    appState.skillLevels[skill] = Math.round((appState.skillLevels[skill] * 0.65) + (score * 0.35));
    const course = COURSES.find((item) => item.skill === skill);
    if (course && session.kind !== 'test') appState.courseProgress[course.id] = Math.min(100, (appState.courseProgress[course.id] || 0) + 4);
  });
  if (session.kind === 'lesson') {
    appState.dailyCompleted = true;
    appState.dailySolved += summary.total;
  }
  if (session.kind === 'test' && session.skill) {
    appState.testScores[session.skill] = Math.max(appState.testScores[session.skill] || 0, summary.accuracy);
  }
  if (session.kind === 'course' && session.courseId) {
    appState.courseProgress[session.courseId] = Math.min(100, (appState.courseProgress[session.courseId] || 0) + 8);
  }
  appState.totalSolved += summary.total;
  appState.totalCorrect += summary.correct;
  appState.xp += summary.xp;
  appState.totalMinutes += Math.max(1, Math.round((Date.now() - session.startedAt) / 60000));
  const todayIndex = (new Date().getDay() + 6) % 7;
  appState.weekly[todayIndex] = (appState.weekly[todayIndex] || 0) + summary.total;
  appState.activitySeed[appState.activitySeed.length - 1] = 2;
  saveState();
  render();
}

function restartSession() {
  if (!session) return;
  session = {
    kind: session.kind, title: session.title, questions: session.questions,
    skill: session.skill, courseId: session.courseId,
    index: 0, answers: {}, selected: '', checked: false, hintVisible: false,
    startedAt: Date.now(), finished: false, summary: null
  };
  render();
}

function finishSessionAndLeave() {
  const kind = session?.kind;
  session = null;
  if (kind === 'test') go('tests');
  else if (kind === 'course') go('course');
  else go('home');
}

function applyPlan() {
  if (!diagnosticPreview) return;
  appState.plan = createPersonalPlan(diagnosticPreview.skills);
  appState.diagnostic = {
    completed: true,
    score: diagnosticPreview.score,
    date: new Date().toISOString().slice(0, 10),
    skills: { ...diagnosticPreview.skills }
  };
  appState.skillLevels = { ...appState.skillLevels, ...diagnosticPreview.skills };
  appState.notificationsRead = false;
  saveState();
  diagnosticPreview = null;
  go('home');
  showToast('Персональная программа готова!');
}

function openNotifications() {
  if (!appState.user.notifications) {
    showModal(`<div class="modal-header"><div><span class="eyebrow">УВЕДОМЛЕНИЯ</span><h2>Уведомления выключены</h2></div><button class="icon-button" type="button" data-action="close-modal">${icon('x', 20)}</button></div><div class="install-instructions"><span class="app-panel-logo">${icon('bell', 48)}</span><p>Их можно включить в настройках профиля. Занятия и сохранение прогресса работают независимо от этой настройки.</p><button class="button primary wide" type="button" data-route="profile">Открыть настройки</button></div>`, 'small-modal');
    return;
  }
  showModal(`<div class="modal-header"><div><span class="eyebrow">ЧТО НОВОГО</span><h2>Уведомления</h2></div><button class="icon-button" type="button" data-action="close-modal" aria-label="Закрыть">${icon('x', 20)}</button></div>
    <div class="notification-list"><div class="notification-item ${appState.notificationsRead ? '' : 'unread'}"><span class="notification-icon mint">${icon('sparkle', 21)}</span><div><strong>Твоя программа готова</strong><p>Сегодня: ${appState.plan.map((skill) => SKILLS[skill].short).join(', ')}.</p><small>Сегодня</small></div></div><div class="notification-item"><span class="notification-icon peach">${icon('flame', 21)}</span><div><strong>Серия — ${appState.streak} дней!</strong><p>Отличный ритм. Одно короткое занятие сохранит серию.</p><small>Вчера</small></div></div><div class="notification-item"><span class="notification-icon lavender">${icon('award', 21)}</span><div><strong>Новое достижение</strong><p>«Точный расчёт» — больше 100 верных ответов.</p><small>2 дня назад</small></div></div></div>
    <button class="button secondary wide" type="button" data-action="mark-notifications">${icon('check', 17)} Отметить всё прочитанным</button>`, 'notification-modal');
}

function installApp() {
  if (deferredInstallPrompt) {
    deferredInstallPrompt.prompt();
    deferredInstallPrompt.userChoice.then(() => { deferredInstallPrompt = null; });
    return;
  }
  const isIos = /iphone|ipad|ipod/i.test(navigator.userAgent);
  showModal(`<div class="modal-header"><div><span class="eyebrow">ПРИЛОЖЕНИЕ SANA</span><h2>Установи и занимайся удобнее</h2></div><button class="icon-button" type="button" data-action="close-modal">${icon('x', 20)}</button></div><div class="install-instructions"><span class="app-panel-logo">${brandMark(56)}</span><p>Sana работает как приложение прямо из браузера — отдельная иконка, полноэкранный режим и сохранённый прогресс.</p><ol>${isIos ? '<li>Нажми <strong>«Поделиться»</strong> в Safari.</li><li>Выбери <strong>«На экран “Домой”»</strong>.</li><li>Подтверди добавление.</li>' : '<li>Открой меню браузера <strong>⋮</strong>.</li><li>Выбери <strong>«Установить приложение»</strong> или <strong>«Добавить на главный экран»</strong>.</li><li>Подтверди установку.</li>'}</ol><button class="button primary wide" type="button" data-action="close-modal">Понятно</button></div>`, 'small-modal');
}

function handleAction(actionElement, event) {
  const action = actionElement.dataset.action;
  if (action === 'close-modal') closeModal();
  if (action === 'open-notifications') openNotifications();
  if (action === 'mark-notifications') { appState.notificationsRead = true; saveState(); closeModal(); renderChrome(); showToast('Уведомления прочитаны'); }
  if (action === 'install-app') installApp();
  if (action === 'start-diagnostic') startDiagnostic();
  if (action === 'start-lesson') {
    const daily = dailyLessonConfig();
    startSession('lesson', 'Занятие на сегодня', makeLessonQuestions(appState.plan, daily.perSkill, appState.dailyCompleted ? 1 : 0));
  }
  if (action === 'start-test') {
    const skill = actionElement.dataset.skill;
    startSession('test', `Тест: ${SKILLS[skill].title}`, makeLessonQuestions([skill], 5), { skill });
  }
  if (action === 'start-course-lesson') {
    const skill = actionElement.dataset.skill;
    const index = Number(actionElement.dataset.index) || 0;
    const course = COURSES.find((item) => item.skill === skill);
    startSession('course', `${course.title} · Урок ${index + 1}`, makeLessonQuestions([skill], 5, index), { skill, courseId: course.id });
  }
  if (action === 'filter-courses') { courseFilter = actionElement.dataset.filter; render(); }
  if (action === 'open-course') { activeCourseId = actionElement.dataset.course; go('course'); }
  if (action === 'select-option' && session && !session.checked) {
    session.selected = actionElement.dataset.value;
    render();
  }
  if (action === 'show-hint' && session) { session.hintVisible = true; render(); }
  if (action === 'check-answer') handleCheckAnswer();
  if (action === 'next-question') advanceSession();
  if (action === 'restart-session') restartSession();
  if (action === 'finish-session') finishSessionAndLeave();
  if (action === 'session-exit') {
    event.preventDefault();
    if (!session) { go('home'); return; }
    confirmDialog({ title: 'Выйти из занятия?', text: 'Ответы этой попытки не сохранятся. Ты сможешь начать заново в любой момент.', confirmText: 'Выйти', action: 'confirm-session-exit' });
  }
  if (action === 'confirm-session-exit') {
    const kind = session?.kind;
    session = null;
    closeModal();
    go(kind === 'test' ? 'tests' : kind === 'course' ? 'course' : kind === 'diagnostic' ? 'diagnostic' : 'home');
  }
  if (action === 'apply-plan') applyPlan();
  if (action === 'reset-data') confirmDialog({ title: 'Сбросить весь прогресс?', text: 'Результаты тестов, уровни и настройки вернутся к исходным демо-данным.', confirmText: 'Сбросить', action: 'confirm-reset', danger: true });
  if (action === 'confirm-reset') {
    appState = cloneDefaultState(); saveState(); session = null; diagnosticPreview = null; closeModal(); go('home'); showToast('Демо-прогресс восстановлен');
  }
}

document.addEventListener('click', (event) => {
  const routeElement = event.target.closest('[data-route]');
  if (routeElement) {
    event.preventDefault();
    closeModal();
    go(routeElement.dataset.route);
    return;
  }
  const actionElement = event.target.closest('[data-action]');
  if (actionElement) handleAction(actionElement, event);
});

document.addEventListener('input', (event) => {
  if (event.target.id === 'answer-input' && session && !session.checked) {
    session.selected = event.target.value;
    const button = document.querySelector('#answer-check');
    if (button) button.disabled = !normalizeAnswer(session.selected);
  }
});

document.addEventListener('submit', (event) => {
  if (event.target.id === 'answer-input-form') {
    event.preventDefault();
    handleCheckAnswer();
  }
  if (event.target.id === 'profile-form') {
    event.preventDefault();
    const form = new FormData(event.target);
    const name = String(form.get('name') || '').trim();
    if (!name) { showToast('Введи имя ученика', 'info'); return; }
    appState.user = {
      ...appState.user,
      name,
      grade: String(form.get('grade')),
      dailyGoal: Number(form.get('dailyGoal')),
      notifications: form.get('notifications') === 'on'
    };
    saveState();
    render();
    showToast('Настройки сохранены');
  }
});

document.addEventListener('keydown', (event) => {
  if (event.key === 'Escape' && modalRoot.innerHTML) closeModal();
  if (currentRoute === 'session' && session && !session.checked && !session.finished && ['1', '2', '3', '4'].includes(event.key) && document.activeElement?.tagName !== 'INPUT') {
    const question = session.questions[session.index];
    const option = question.options?.[Number(event.key) - 1];
    if (option) { session.selected = option; render(); }
  }
  if (event.key === 'Enter' && currentRoute === 'session' && session?.checked && !modalRoot.innerHTML) {
    event.preventDefault();
    advanceSession();
  }
});

window.addEventListener('hashchange', () => {
  const route = location.hash.slice(1);
  currentRoute = ROUTES.includes(route) ? route : 'home';
  closeModal();
  render();
});

window.addEventListener('beforeinstallprompt', (event) => {
  event.preventDefault();
  deferredInstallPrompt = event;
});

function initialise() {
  document.querySelector('#sidebar-brand-mark').innerHTML = brandMark(40);
  document.querySelectorAll('[data-icon]').forEach((element) => {
    element.innerHTML = icon(element.dataset.icon, element.dataset.icon === 'bell' ? 21 : 20);
  });
  const route = location.hash.slice(1);
  currentRoute = ROUTES.includes(route) && route !== 'session' ? route : 'home';
  render();
  if ('serviceWorker' in navigator && /^https?:$/.test(location.protocol)) {
    navigator.serviceWorker.register('./sw.js').catch(() => {});
  }
}

initialise();

})();
</script>
</body>
</html>
