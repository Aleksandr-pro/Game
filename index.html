<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#f4f6f2" />
  <meta name="description" content="Sana — персональные занятия математикой каждый день. Диагностика, индивидуальная программа, курсы и тесты с понятными объяснениями." />
  <title>Sana — математика каждый день</title>
  <link rel="manifest" href="manifest.webmanifest" />
  <link rel="stylesheet" href="styles.css" />
  <link rel="icon" href="icons/favicon-64.png" type="image/png" />
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="default" />
  <meta name="apple-mobile-web-app-title" content="Sana" />
  <meta name="application-name" content="Sana" />
  <meta property="og:title" content="Sana — математика каждый день" />
  <meta property="og:description" content="Диагностика знаний, личная программа и короткие ежедневные занятия математикой." />
  <meta property="og:type" content="website" />
  <meta property="og:image" content="icons/icon-512.png" />
</head>
<body>
  <div id="app" class="app-shell">
    <aside class="sidebar" aria-label="Основная навигация">
      <a class="brand" href="#home" data-route="home" aria-label="Sana — на главную">
        <span class="brand-mark" id="sidebar-brand-mark"></span>
        <span class="brand-copy"><strong>sana</strong><small>математика каждый день</small></span>
      </a>

      <nav class="side-nav">
        <span class="nav-caption">ОБУЧЕНИЕ</span>
        <a href="#home" class="nav-item" data-route="home"><span data-icon="home"></span><span>Главная</span></a>
        <a href="#courses" class="nav-item" data-route="courses"><span data-icon="book"></span><span>Мои курсы</span></a>
        <a href="#tests" class="nav-item" data-route="tests"><span data-icon="clipboard"></span><span>Тесты</span><span class="nav-badge">7</span></a>
        <a href="#progress" class="nav-item" data-route="progress"><span data-icon="chart"></span><span>Прогресс</span></a>
      </nav>

      <div class="sidebar-spacer"></div>
      <div class="level-card" id="level-card"></div>
      <button class="install-card" type="button" data-action="install-app">
        <span class="install-card-icon" data-icon="download"></span>
        <span><strong>Установить Sana</strong><small>Заниматься ещё удобнее</small></span>
      </button>
      <div class="sidebar-bottom">
        <span class="status-dot"></span>
        <span>Прогресс сохраняется автоматически</span>
      </div>
    </aside>

    <div class="app-body">
      <header class="topbar">
        <div class="topbar-context">
          <span class="context-eyebrow">ЛИЧНЫЙ КАБИНЕТ</span>
          <span id="context-title">Мой день</span>
        </div>
        <div class="topbar-actions">
          <div class="streak-pill" id="header-streak" title="Дней подряд"></div>
          <button class="icon-button notification-button" type="button" data-action="open-notifications" aria-label="Уведомления">
            <span data-icon="bell"></span><span class="notification-dot" id="notification-dot"></span>
          </button>
          <a href="#profile" class="profile-link" data-route="profile" aria-label="Открыть профиль">
            <span class="avatar" id="header-avatar">А</span>
            <span class="profile-link-copy"><strong id="header-name">Али</strong><small id="header-grade">7 класс</small></span>
            <span data-icon="chevron" class="profile-chevron"></span>
          </a>
        </div>
      </header>

      <main id="main-content" class="main-content"></main>
    </div>

    <nav class="mobile-nav" aria-label="Мобильная навигация">
      <a href="#home" data-route="home" class="mobile-nav-item"><span data-icon="home"></span><span>Главная</span></a>
      <a href="#courses" data-route="courses" class="mobile-nav-item"><span data-icon="book"></span><span>Курсы</span></a>
      <a href="#tests" data-route="tests" class="mobile-nav-item"><span data-icon="clipboard"></span><span>Тесты</span></a>
      <a href="#progress" data-route="progress" class="mobile-nav-item"><span data-icon="chart"></span><span>Прогресс</span></a>
      <a href="#profile" data-route="profile" class="mobile-nav-item"><span data-icon="user"></span><span>Профиль</span></a>
    </nav>
  </div>

  <div id="modal-root"></div>
  <div id="toast" class="toast" role="status" aria-live="polite"></div>
  <script type="module" src="src/app.js"></script>
</body>
</html>
