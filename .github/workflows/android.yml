name: Sana Android APK

on:
  push:
    branches: [main]
    paths:
      - 'src/**'
      - 'index.html'
      - 'styles.css'
      - 'manifest.webmanifest'
      - 'sw.js'
      - 'icons/**'
      - 'release/**'
      - 'android/**'
      - 'scripts/**'
      - 'tests/**'
      - 'package.json'
      - 'package-lock.json'
      - '.github/workflows/android.yml'
  pull_request:
    paths:
      - 'android/**'
      - 'src/**'
      - 'scripts/**'
      - '.github/workflows/android.yml'
  workflow_dispatch:
    inputs:
      version_name:
        description: 'Версия (по умолчанию из package.json)'
        required: false
        default: ''

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: sana-android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Сборка Sana APK
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Код
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: 'platforms;android-34 build-tools;34.0.0 platform-tools'
          log-accepted-android-sdk-licenses: true

      - name: Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Зависимости и проверки
        run: |
          npm ci
          npm test
          npm run icons
          npm run android:icons

      - name: Номер сборки и версия
        id: ver
        run: |
          CODE=$(git rev-list --count HEAD)
          NAME="${{ github.event.inputs.version_name }}"
          if [ -z "$NAME" ]; then NAME=$(node -p "require('./package.json').version"); fi
          echo "code=$CODE" >> "$GITHUB_OUTPUT"
          echo "name=$NAME" >> "$GITHUB_OUTPUT"

      - name: Сборка APK
        working-directory: android
        run: |
          set -o pipefail
          gradle assembleRelease --no-daemon --stacktrace \
            -PversionCode=${{ steps.ver.outputs.code }} \
            -PversionName=${{ steps.ver.outputs.name }} 2>&1 | tee /tmp/sana-gradle-build.log

      - name: Проверка APK
        run: |
          APK=$(find android/app/build/outputs/apk/release -name '*.apk' | head -1)
          BT=$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -1)
          "$BT/apksigner" verify --print-certs "$APK"
          "$BT/aapt" dump badging "$APK" | grep -E "package:|application-label|sdkVersion|targetSdkVersion" | head -5

      - name: Подготовка файлов релиза
        run: |
          mkdir -p dist
          APK=$(find android/app/build/outputs/apk/release -name '*.apk' | head -1)
          cp "$APK" dist/Sana.apk
          SHA=$(sha256sum dist/Sana.apk | cut -d' ' -f1)
          echo "$SHA  Sana.apk" > dist/SHA256SUMS.txt
          echo "APK_SHA=$SHA" >> "$GITHUB_ENV"

      - name: Артефакт сборки
        uses: actions/upload-artifact@v4
        with:
          name: Sana-apk-${{ steps.ver.outputs.code }}
          path: dist/*
          if-no-files-found: error
          retention-days: 30

      - name: Публикация релиза
        if: github.event_name != 'pull_request'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: sana-android-latest
          name: Sana — Android (последняя версия)
          body: |
            ## Sana для Android

            **Версия:** v${{ steps.ver.outputs.name }} (сборка ${{ steps.ver.outputs.code }})
            **Коммит:** `${{ github.sha }}`

            Скачайте **Sana.apk**, откройте файл и разрешите установку из этого источника.
            Диагностика, курсы и ежедневные занятия работают без интернета.

            ```text
            SHA-256: ${{ env.APK_SHA }}
            ```
          files: |
            dist/Sana.apk
            dist/SHA256SUMS.txt
          fail_on_unmatched_files: true
          make_latest: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Итог
        run: |
          echo "### 📦 Sana APK готов" >> "$GITHUB_STEP_SUMMARY"
          echo "- версия: **v${{ steps.ver.outputs.name }}** (versionCode ${{ steps.ver.outputs.code }})" >> "$GITHUB_STEP_SUMMARY"
          echo "- SHA-256: ${{ env.APK_SHA }}" >> "$GITHUB_STEP_SUMMARY"
