# Ключ подписи Android-приложения Brawl Arena.
# Лежит в открытом репозитории намеренно: только с одинаковой подписью
# Android устанавливает новую версию APK поверх предыдущей.
# Не используйте этот ключ для других приложений.
storeFile=keystore/brawl-arena.p12
storePassword=brawlarena
keyAlias=brawlarena
keyPassword=brawlarena
storeType=PKCS12
