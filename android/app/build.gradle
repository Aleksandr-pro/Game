plugins {
    id 'com.android.application'
}

// ---------- Версия ----------
// versionCode берётся из -PversionCode (в CI это число коммитов — всегда растёт),
// versionName — из -PversionName (версия из package.json).
def pVersionCode = (project.findProperty('versionCode') ?: '1').toString().toInteger()
def pVersionName = (project.findProperty('versionName') ?: '1.0.0').toString()

// ---------- Подпись ----------
// Ключ лежит в репозитории, чтобы все сборки подписывались одинаково:
// иначе Android не даст установить обновление поверх старой версии.
def keystorePropsFile = rootProject.file('keystore.properties')
def keystoreProps = new Properties()
if (keystorePropsFile.exists()) {
    keystorePropsFile.withInputStream { keystoreProps.load(it) }
}
def hasKeystore = keystorePropsFile.exists() && keystoreProps.getProperty('storeFile')

android {
    namespace 'com.brawlarena.game'
    compileSdk 34

    defaultConfig {
        applicationId 'com.brawlarena.game'
        minSdk 23
        targetSdk 34
        versionCode pVersionCode
        versionName pVersionName
        resValue 'string', 'app_version_name', pVersionName
        resValue 'integer', 'app_version_code', pVersionCode.toString()
    }

    signingConfigs {
        release {
            if (hasKeystore) {
                storeFile rootProject.file(keystoreProps.getProperty('storeFile'))
                storePassword keystoreProps.getProperty('storePassword')
                keyAlias keystoreProps.getProperty('keyAlias')
                keyPassword keystoreProps.getProperty('keyPassword')
                storeType keystoreProps.getProperty('storeType') ?: 'PKCS12'
            }
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            shrinkResources false
            signingConfig hasKeystore ? signingConfigs.release : signingConfigs.debug
        }
        debug {
            applicationIdSuffix '.debug'
            versionNameSuffix '-debug'
        }
    }

    buildFeatures {
        buildConfig true
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    lint {
        abortOnError false
        checkReleaseBuilds false
    }
}

// ---------- Игровые ассеты ----------
// Перед сборкой подкладываем свежую офлайн-версию игры в assets.
// Источник: release/BrawlArena.html (npm run build), fallback — соберём на месте.
def assetsDir = file("$projectDir/src/main/assets")
def releaseHtml = rootProject.file('../release/BrawlArena.html')

tasks.register('prepareGameAssets') {
    doLast {
        if (!releaseHtml.exists()) {
            throw new GradleException('Нет release/BrawlArena.html — сначала выполните npm run build')
        }
        assetsDir.mkdirs()
        copy {
            from releaseHtml
            into assetsDir
            rename { 'index.html' }
        }
        def json = new groovy.json.JsonBuilder([
            versionCode: pVersionCode,
            versionName: pVersionName,
            platform   : 'android',
            builtAt    : new Date().format("yyyy-MM-dd'T'HH:mm:ss'Z'", TimeZone.getTimeZone('UTC')),
        ]).toString()
        new File(assetsDir, 'version.json').text = json
        logger.lifecycle("Игра упакована: v${pVersionName} (${pVersionCode})")
    }
}

tasks.named('preBuild').configure { dependsOn 'prepareGameAssets' }

// Понятное имя итогового файла
tasks.register('renameApk') {
    doLast {
        def apkDir = file("$buildDir/outputs/apk/release")
        def apk = apkDir.listFiles()?.find { it.name.endsWith('.apk') && !it.name.contains('unsigned') }
        if (apk != null) {
            def target = new File(apkDir, 'BrawlArena.apk')
            if (target.exists()) target.delete()
            apk.renameTo(target)
            logger.lifecycle("APK: ${target.absolutePath}")
        }
    }
}

// Задачи вариантов появляются после оценки проекта, поэтому вешаем хук в afterEvaluate.
afterEvaluate {
    tasks.matching { it.name == 'assembleRelease' }.configureEach {
        finalizedBy 'renameApk'
    }
}
